# layer_hotkey, keystroke_sent, label
# Keys above the first [class] apply to every application that has no section.
# A section replaces those keys for that Hyprland window class.
# A blank label disables that key and hides it from the hint.

f, ctrl+f, find
n, ctrl+n, new
w, ctrl+w, close
s, ctrl+s, save
j, ctrl+tab, next
k, ctrl+shift+tab, previous

[brave-browser]
# New opens a tab. Brave has no command palette on the generic chord.
f, ctrl+f, find
n, ctrl+t, new tab
w, ctrl+w, close
s, ctrl+shift+s, screen shot
j, ctrl+tab, next
k, ctrl+shift+tab, previous
d, ctrl+j, downloads
-, ctrl+-, zoom out
=, ctrl+shift+=, zoom in
x, ctrl+shift+Del, delete browsing data
h, ctrl+h, history
space, ctrl+space, quick commands

[Code]
space, ctrl+shift+p, palette
f, ctrl+f, find
n, ctrl+n, new
w, ctrl+w, close
s, ctrl+s, save
j, ctrl+tab, next
k, ctrl+shift+tab, previous

[foot]
# Search and a new terminal are the commands Foot binds by default.
f, ctrl+shift+r, find
n, ctrl+shift+n, new
w, super+w, quit
s, ctrl+s,

[md.obsidian.Obsidian]
space, ctrl+p, palette
f, ctrl+f, find
n, ctrl+n, new
w, ctrl+w, close
s, ctrl+s, save
j, ctrl+tab, next
k, ctrl+shift+tab, previous

[signal]
f, ctrl+f, find
n, ctrl+n, new
w, ctrl+w, close

[org.omarchy.agent]
u, "/usage\r", usage
