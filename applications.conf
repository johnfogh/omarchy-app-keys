# layer_hotkey, sent, ..., label
#
# Every comma-separated field except the last is sent, in order. The last
# field is the label. Each sent field is a chord or a quoted string.
#   f, ctrl+f, find
#   shift+f, ctrl+shift+f, find selection
#   f2, "help", help
#   w, super+w, quit
#   u, "/usage", "\r", usage
# Layer keys are a–z, space, -, =, or f1–f12, optionally with ctrl, alt,
# and/or shift (e.g. ctrl+f1, alt+shift+s). Alt+Space enters the layer.
# Bare F1 opens the configuration dialog and is not a layer key.
# A sent chord uses + between ctrl, alt, shift, super, and the key.
# A chord that contains super is pressed for Hyprland, not typed into the
# application. super+w runs Hyprland's close-window binding.
# A double-quoted string is typed into the focused application. Escapes are
# \n, \t, \r, \\, \", and \xNN. Single quotes are taken literally.
#
# Lines before the first [class] are the generic keys. A [class] section is
# used only while a window of that class is focused, and its lines override
# the generic key with the same name. A blank label, or the label DISABLED,
# hides that key and does nothing when it is pressed. DISABLED does not
# produce a warning.

f, ctrl+f, find
n, ctrl+n, new
w, ctrl+w, close
s, ctrl+s, save
j, ctrl+tab, next
k, ctrl+shift+tab, previous
=, ctrl+=, ctrl+=, ctrl+=, zoom in
-, ctrl+-, ctrl+-, ctrl+-, zoom out

[brave-browser]
# New opens a tab. Brave has no command palette on the generic chord.
f, ctrl+f, find
n, ctrl+t, new tab
w, ctrl+w, close
s, ctrl+shift+s, screen shot
j, ctrl+tab, next
k, ctrl+shift+tab, previous
d, ctrl+j, downloads
-, ctrl+-, zoom out
=, ctrl+shift+=, zoom in
x, ctrl+shift+Del, delete browsing data
h, ctrl+h, history
space, ctrl+space, quick commands

[Code]
space, ctrl+shift+p, palette
f, ctrl+f, find
n, ctrl+n, new
w, ctrl+w, close
s, ctrl+s, save
j, ctrl+tab, next
k, ctrl+shift+tab, previous

[foot]
# Search and a new terminal are the commands Foot binds by default.
f, ctrl+shift+r, find
n, ctrl+shift+n, new
w, super+w, quit
s, DISABLED

